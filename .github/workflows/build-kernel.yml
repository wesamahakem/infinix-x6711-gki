name: Build GKI Kernel (X6711)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile GKI 5.10.198 (Droidspaces + SUSFS)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Setup System & Free Disk/Memory
        run: |
          echo "Initial disk space:"
          df -h

          # Set up 6 GB swap to prevent OOM during vmlinux linking
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            kmod libelf-dev libssl-dev libncurses-dev pahole \
            python3 python-is-python3 rsync tar wget xz-utils zip zstd \
            device-tree-compiler zlib1g-dev libyaml-dev pkg-config

      - name: Download AOSP Clang Toolchain (r416183b)
        run: |
          mkdir -p $HOME/toolchains/clang-r416183b
          curl -LSs "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r416183b.tar.gz" | tar -xz -C $HOME/toolchains/clang-r416183b
          
          # Setup libtinfo compat symlink for clang
          mkdir -p $HOME/toolchains/.compat
          tinfo="$(ldconfig -p | awk '/libtinfo\.so\.6/ && !seen++ {print $NF}')"
          if [ -n "${tinfo}" ]; then
            ln -sf "${tinfo}" "$HOME/toolchains/.compat/libtinfo.so.5"
          fi

      - name: Clone Google AOSP Common Kernel 5.10
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth 1 origin 85b72e945a8d29c359a2f0018e9426d346a7bde4
          git checkout FETCH_HEAD
          echo "Checked out exact OEM matching commit: $(git rev-parse HEAD)"

      - name: Apply Droidspaces & SUSFS Patches
        run: |
          # 1. Clone susfs4ksu (gki-android12-5.10)
          git clone --depth 1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
          cp susfs/kernel_patches/fs/* kernel/fs/
          cp susfs/kernel_patches/include/linux/* kernel/include/linux/

          cd kernel
          # Apply SUSFS patch
          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # Apply Droidspaces kABI patches (slots 6, 7, 8)
          patch -p1 < ../patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 < ../patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

          # Apply defconfig options in-place using our python script
          python3 ../scripts/apply_defconfig.py arch/arm64/configs/gki_defconfig ../gki_defconfig.fragment
          echo "Patches applied successfully."

      - name: Build Kernel (Image.gz)
        run: |
          export PATH="$HOME/toolchains/clang-r416183b/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchains/.compat:$HOME/toolchains/clang-r416183b/lib:$HOME/toolchains/clang-r416183b/lib64:${LD_LIBRARY_PATH:-}"

          cd kernel

          BUILD_ARGS=(
            -j$(nproc)
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            HOSTCC=gcc
            HOSTCXX=g++
          )

          echo "Configuring gki_defconfig..."
          make "${BUILD_ARGS[@]}" gki_defconfig

          echo "Compiling Image.gz..."
          make "${BUILD_ARGS[@]}" Image.gz

          echo "Verifying compiled kernel artifacts:"
          ls -lh arch/arm64/boot/Image arch/arm64/boot/Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          cp kernel/arch/arm64/boot/Image.gz anykernel/Image.gz
          cd anykernel
          zip -r9 ../AnyKernel3-X6711-GKI-5.10.198-Droidspaces-SUSFS.zip * -x .git README.md
          cd ..
          ls -lh AnyKernel3-X6711-GKI-5.10.198-Droidspaces-SUSFS.zip

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6711-GKI-5.10.198-Droidspaces-SUSFS
          path: |
            AnyKernel3-X6711-GKI-5.10.198-Droidspaces-SUSFS.zip
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/Image
